name: Bug report
description: Report an unexpected scenario outcome.
body:
  - type: input
    id: environment
    attributes:
      label: OS, Python and Forka versions
      description: Include the operating system, interpreter version and Forka release or commit.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal Model or Scenario
      description: Include the model or scenario, the seed if set, and the configuration needed to run it.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the branch, score, termination reason or other result you expect.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Current simulation result
      description: Include the command and observed result or traceback.
    validations:
      required: true
