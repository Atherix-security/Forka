name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
      - run: python examples/coin_branch.py
      - run: python examples/attacker_defender.py
      - run: python examples/population_growth.py
      - run: python examples/branch_merging.py
      - run: python examples/experiment_runs.py --workers 2
      - run: python examples/system_under_test.py
      - run: python -m benchmarks.run --smoke --output benchmark-smoke.json
      - run: python -m build
      - name: Install built wheel and verify imports
        shell: bash
        run: |
          python -m pip uninstall -y forka
          python -m pip install --no-deps dist/*.whl
          python -m pytest -q
          python examples/coin_branch.py
          python examples/attacker_defender.py
          python examples/population_growth.py
          python examples/branch_merging.py
          python examples/experiment_runs.py --workers 2
          python examples/system_under_test.py
